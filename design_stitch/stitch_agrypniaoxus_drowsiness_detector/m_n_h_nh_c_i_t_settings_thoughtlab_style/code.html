<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #0a0a0a;
            color: #ffffff;
            -webkit-font-smoothing: antialiased;
            font-family: 'Hanken Grotesk', sans-serif;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            background: #fc1c46;
            cursor: pointer;
            border-radius: 50%;
        }
        input[type="range"] {
            -webkit-appearance: none;
            background: #2a2a2a;
            height: 2px;
        }
        .hairline-divider {
            height: 1px;
            background-color: rgba(255, 255, 255, 0.08);
            width: 100%;
        }
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom);
        }
    </style>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "graphite": "#4c4c4c",
                    "signal-red": "#fc1c46",
                    "void": "#000000",
                    "background": "#0a0a0a",
                    "ash": "#cccccc",
                    "pure-white": "#ffffff"
            },
            "fontFamily": {
                    "hanken": ["Hanken Grotesk"]
            }
          },
        },
      }
    </script>
</head>
<body class="bg-background text-pure-white font-hanken min-h-screen pb-32">
<!-- Top Bar -->
<header class="fixed top-0 w-full z-50 bg-background/90 backdrop-blur-md px-6 h-16 flex justify-between items-center">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-signal-red" data-icon="sensors">sensors</span>
<span class="text-ash text-sm tracking-[0.2em] uppercase font-medium">AgrypniaOxus</span>
</div>
<span class="material-symbols-outlined text-ash/40" data-icon="battery_charging_full">battery_charging_full</span>
</header>
<main class="mt-24 px-6 max-w-xl mx-auto space-y-12">
<!-- Page Title -->
<section>
<h1 class="text-[72px] font-light leading-none tracking-tighter text-pure-white uppercase">Settings</h1>
</section>
<!-- Profile Section -->
<section class="flex items-center gap-6 py-4">
<div class="w-16 h-16 rounded-full overflow-hidden bg-ash/10">
<img alt="Profile" class="w-full h-full object-cover grayscale opacity-80" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDjKdLhzP0xfihbwfKhmHZVpFk7TyRE2Z5_1y19K9bYGU4-rvaROreSgYkYcW9jjTPp3VdDdXzd2Ndv5IgjizsW1p5ZR_2n5tw6305HaVY-FpZC7KrpbAzmFpmsvAJAz16m2ljhoh5tr17iwpbm71SrRio5AZp4pke9ok5_CMcCwLA1nXgjDYaJyj2XYragc7FIi9QfPJTfq0CReXZwiu-_4kFr8XNUpQDsz4VfpgXssRRBrjhf7qkKSWExmnrUoQ9MX8UjscpwezA8"/>
</div>
<div>
<h2 class="text-2xl font-light text-pure-white">Alex Mercer</h2>
<p class="text-xs text-ash tracking-widest uppercase">Long-Haul Specialist</p>
</div>
</section>
<!-- Calibration -->
<section class="space-y-6">
<div class="text-[10px] text-ash/60 tracking-[0.3em] uppercase font-semibold">Calibration</div>
<div class="hairline-divider"></div>
<div class="space-y-6">
<div class="space-y-4">
<div class="flex justify-between items-center">
<label class="text-sm text-ash">Sensor Sensitivity</label>
<span class="text-xs font-semibold text-signal-red uppercase tracking-widest" id="sensitivity-value">Adaptive</span>
</div>
<input class="w-full appearance-none cursor-pointer" max="100" min="1" type="range" value="65"/>
<div class="flex justify-between text-[10px] text-ash/40 uppercase tracking-widest">
<span>Min</span>
<span>Max</span>
</div>
</div>
<button class="flex items-center gap-3 py-2 text-pure-white group">
<span class="material-symbols-outlined text-signal-red group-hover:rotate-45 transition-transform duration-500" data-icon="face_retouching_natural">face_retouching_natural</span>
<span class="text-xs uppercase tracking-[0.2em]">Recalibrate Face Profile</span>
</button>
</div>
</section>
<!-- Alerts -->
<section class="space-y-6">
<div class="text-[10px] text-ash/60 tracking-[0.3em] uppercase font-semibold">Alerts</div>
<div class="hairline-divider"></div>
<div class="space-y-2">
<div class="flex justify-between items-center py-4">
<span class="text-sm text-ash">Sound Alert</span>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox"/>
<div class="w-10 h-4 bg-ash/10 rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-ash/40 after:rounded-full after:h-3 after:w-5 after:transition-all peer-checked:after:bg-signal-red"></div>
</label>
</div>
<div class="hairline-divider opacity-50"></div>
<div class="flex justify-between items-center py-4">
<span class="text-sm text-ash">Vibration Alert</span>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox"/>
<div class="w-10 h-4 bg-ash/10 rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-ash/40 after:rounded-full after:h-3 after:w-5 after:transition-all peer-checked:after:bg-signal-red"></div>
</label>
</div>
</div>
</section>
<!-- Device -->
<section class="space-y-6">
<div class="text-[10px] text-ash/60 tracking-[0.3em] uppercase font-semibold">Device</div>
<div class="hairline-divider"></div>
<div class="flex justify-between items-center py-2">
<div>
<p class="text-sm text-ash">Oxus-v4 Hub</p>
<p class="text-[10px] text-ash/40 tracking-wider">FIRMWARE 2.4.8 • STABLE</p>
</div>
<div class="flex items-center gap-2">
<div class="w-1.5 h-1.5 rounded-full bg-signal-red shadow-[0_0_8px_#fc1c46]"></div>
<span class="text-[10px] text-pure-white uppercase tracking-widest font-semibold">Live</span>
</div>
</div>
</section>
<!-- Danger Zone -->
<section class="pt-8">
<button class="w-full py-4 border border-signal-red/20 text-signal-red text-xs uppercase tracking-[0.3em] font-semibold hover:bg-signal-red/5 transition-colors">
                Terminate Session
            </button>
</section>
</main>
<!-- Bottom Navigation -->
<nav class="fixed bottom-0 w-full z-50 bg-background/95 backdrop-blur-xl border-t border-white/5 flex justify-around items-center h-20 pb-safe">
<a class="flex flex-col items-center justify-center text-ash/40 hover:text-ash transition-colors" href="#">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
<span class="text-[9px] uppercase tracking-widest mt-1">Detect</span>
</a>
<a class="flex flex-col items-center justify-center text-ash/40 hover:text-ash transition-colors" href="#">
<span class="material-symbols-outlined" data-icon="analytics">analytics</span>
<span class="text-[9px] uppercase tracking-widest mt-1">Stats</span>
</a>
<a class="flex flex-col items-center justify-center text-signal-red" href="#">
<span class="material-symbols-outlined" data-icon="settings" data-weight="fill" style="font-variation-settings: 'FILL' 1;">settings</span>
<span class="text-[9px] uppercase tracking-widest mt-1 font-bold">Set</span>
</a>
</nav>
<script>
        const range = document.querySelector('input[type="range"]');
        const valueDisplay = document.getElementById('sensitivity-value');
        
        range.addEventListener('input', (e) => {
            const val = e.target.value;
            if(val < 30) valueDisplay.textContent = 'Stable';
            else if(val < 70) valueDisplay.textContent = 'Adaptive';
            else valueDisplay.textContent = 'Extreme';
        });
    </script>
</body></html>
