<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>

<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;700&amp;display=swap" rel="stylesheet"/>

        theme: {
          extend: {

                    "signal-red": "#fc1c46",

                    "surface-container": "#201f1f",
                    "inverse-primary": "#bf002f",
                    "tertiary": "#c6c6c6",
                    "ash": "#cccccc",
                    "primary-fixed-dim": "#ffb3b3",
                    "tertiary-fixed": "#e3e2e2",
                    "on-error-container": "#ffdad6",
                    "surface-tint": "#ffb3b3",
                    "on-primary-fixed": "#400009",
                    "surface": "#131313",
                    "error-container": "#93000a",
                    "primary-fixed": "#ffdad9",
                    "on-background": "#e5e2e1",
                    "on-primary-fixed-variant": "#920022",
                    "tertiary-container": "#909191",
                    "secondary-container": "#454747",
                    "on-surface": "#e5e2e1",
                    "carbon-panel": "#1a1a1a",
                    "primary": "#ffb3b3",
                    "on-tertiary-fixed-variant": "#464747",
                    "on-error": "#690005",
                    "inverse-surface": "#e5e2e1",
                    "surface-variant": "#353534",
                    "surface-container-low": "#1c1b1b",
                    "on-secondary-container": "#b4b5b5",
                    "outline": "#ae8787",
                    "pure-white": "#ffffff",
                    "outline-variant": "#5e3f3f",
                    "surface-dim": "#131313",
                    "on-secondary-fixed-variant": "#454747",
                    "surface-container-highest": "#353534",
                    "on-surface-variant": "#e7bcbc",
                    "on-tertiary-fixed": "#1a1c1c",
                    "inverse-on-surface": "#313030",
                    "secondary": "#c6c6c7",
                    "obsidian-canvas": "#000000",
                    "on-primary": "#680015",
                    "error": "#ffb4ab",
                    "surface-bright": "#3a3939",
                    "on-secondary": "#2f3131",
                    "secondary-fixed": "#e2e2e2",

            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",

                    "full": "9999px"

            "spacing": {

                    "element-gap": "9px",

            },
            "fontFamily": {
                    "hanken": ["Hanken Grotesk"]

        },

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        @keyframes strobe {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        @keyframes violent-shake {
            0% { transform: translate(0, 0); }
            5% { transform: translate(-8px, -5px) rotate(-1deg); }
            10% { transform: translate(8px, 5px) rotate(1deg); }
            15% { transform: translate(-8px, 5px) rotate(-1deg); }
            20% { transform: translate(8px, -5px) rotate(1deg); }
            25% { transform: translate(0, 0); }
        }

        .alert-strobe {
            animation: strobe 0.2s infinite;
        }

        .screen-shake {
            animation: violent-shake 0.4s infinite;
        }

        body {
            min-height: 100dvh;
            background-color: #000000;
        }
    </style>
</head>
<body class="bg-obsidian-canvas text-pure-white overflow-hidden h-screen w-screen flex flex-col font-hanken select-none">
<!-- Emergency HUD Layout -->
<main class="flex-1 flex flex-col relative z-10 px-8 pt-12 pb-12">
<!-- Branding -->
<header class="flex justify-center items-center py-4">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-signal-red" data-icon="sensors">sensors</span>
<span class="text-subheading font-medium tracking-widest text-signal-red uppercase">AgrypniaOxus</span>
</div>
</header>
<!-- Main Alert Content -->
<div class="flex-1 flex flex-col items-center justify-center text-center space-y-12 screen-shake">
<!-- Signal Red Warning Icon -->
<div class="relative">
<span class="material-symbols-outlined text-signal-red !text-[120px]" data-icon="warning" style="font-variation-settings: 'FILL' 1;">warning</span>
</div>
<!-- Massive Headline -->
<div class="space-y-4">
<h1 class="text-[91px] font-light leading-[0.85] tracking-[-0.1em] uppercase">WAKE<br/>UP!</h1>
<p class="text-caption font-bold tracking-[0.4em] text-signal-red uppercase mt-4">Drowsiness Detected</p>
</div>
</div>
<!-- Action Area -->
<div class="mt-auto space-y-6">
<!-- Massive Signal Red Pill Button -->
<button class="w-full h-[88px] bg-signal-red text-void text-subheading font-bold rounded-full transition-transform active:scale-95 uppercase tracking-wider" onclick="dismissAlert()">
            I AM AWAKE
        </button>
<!-- White Outlined Pill Button -->
<button class="w-full h-[64px] border-2 border-pure-white text-pure-white text-caption font-medium rounded-full flex items-center justify-center gap-3 transition-opacity active:opacity-60 uppercase tracking-widest">
<span class="material-symbols-outlined !text-xl" data-icon="emergency">emergency</span>
            Emergency Call
        </button>
</div>
</main>
<!-- Background Visuals -->
<div class="fixed inset-0 pointer-events-none z-0">
<!-- Flashing Red Border (Strobe) -->
<div class="absolute inset-0 border-[24px] border-signal-red/30 alert-strobe"></div>
<!-- Dark Dash Cam Background Overlay -->
<div class="absolute inset-0 -z-10 opacity-40 grayscale contrast-150">
<img alt="Night dashboard view" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA34aSMjV8emnKr0C1G2mSFyy9V_Ieu2nfYOwWP5ch0RcPC7CVlON4dAkCOA6mvUgmtJXnLTsUkQylLzba8lnUoNTisDOL4_-7K-Sd9gGw1vMQoT5QLu-DyxvD6hxQsdL4bIfUI1U6LANFB6XYqugbr08XZD4_geMP4b7N693mNT51-h9VvvE86s9r8yyaTKughA12kpGTWc1SOyxRzJJkwU4umIY4VHWhY6MFNoZXOUO90wiOQfPCKwBc7PUUnAwCm6tNXkVkt8-eq"/>
</div>
</div>
<script>
    function dismissAlert() {
        const main = document.querySelector('main');
        const shake = document.querySelector('.screen-shake');
        const strobe = document.querySelector('.alert-strobe');
        
        // Disable urgency visuals
        shake.classList.remove('screen-shake');
        strobe.classList.remove('alert-strobe');
        
        main.style.transition = 'all 0.4s cubic-bezier(0.16, 1, 0.3, 1)';
        main.style.opacity = '0';
        main.style.transform = 'scale(1.1)';
        
        setTimeout(() => {
            alert("System Monitoring Resumed.");
            location.reload(); 
        }, 500);
    }

    // Attempt haptic feedback on touch if supported
    document.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('touchstart', () => {
            if (window.navigator.vibrate) {
                window.navigator.vibrate([150, 50, 150]);
            }
        });
    });
</script>
</body></html>
