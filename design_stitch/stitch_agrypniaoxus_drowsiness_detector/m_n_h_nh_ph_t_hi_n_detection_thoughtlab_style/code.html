<!DOCTYPE html>

<html class="dark" lang="en"><head>

                    "surface-container": "#201f1f",

                    "ash": "#cccccc",
                    "primary-fixed-dim": "#ffb3b3",
                    "tertiary-fixed": "#e3e2e2",
                    "on-error-container": "#ffdad6",
                    "surface-tint": "#ffb3b3",
                    "on-primary-fixed": "#400009",
                    "surface": "#131313",
                    "error-container": "#93000a",
                    "primary-fixed": "#ffdad9",
                    "on-background": "#e5e2e1",
                    "on-primary-fixed-variant": "#920022",
                    "tertiary-container": "#909191",
                    "secondary-container": "#454747",
                    "on-surface": "#e5e2e1",
                    "carbon-panel": "#1a1a1a",
                    "primary": "#ffb3b3",
                    "on-tertiary-fixed-variant": "#464747",
                    "on-error": "#690005",
                    "inverse-surface": "#e5e2e1",
                    "surface-variant": "#353534",
                    "surface-container-low": "#1c1b1b",
                    "on-secondary-container": "#b4b5b5",
                    "outline": "#ae8787",
                    "pure-white": "#ffffff",
                    "outline-variant": "#5e3f3f",
                    "surface-dim": "#131313",
                    "on-secondary-fixed-variant": "#454747",
                    "surface-container-highest": "#353534",
                    "on-surface-variant": "#e7bcbc",

            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"

            "spacing": {
                    "card-padding": "22px",
                    "element-gap": "9px",
                    "section-gap-min": "86px",
                    "section-gap-max": "108px",

            "fontFamily": {

                    "body-sm": ["Hanken Grotesk"],

                    "headline-lg-mobile": ["48px", {"lineHeight": "1.0", "letterSpacing": "-0.02em", "fontWeight": "300"}]

          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        @keyframes scan {
            0% { top: 0%; opacity: 0; }
            50% { opacity: 0.3; }
            100% { top: 100%; opacity: 0; }
        }
        .animate-scan {
            animation: scan 4s linear infinite;
        }
        body {
            min-height: 100dvh;
            background-color: #0a0a0a;
        }
        .text-huge {
            font-size: clamp(120px, 40vw, 198px);
        }
    </style>
</head>
<body class="bg-obsidian-canvas text-on-surface flex flex-col font-body-sm overflow-hidden selection:bg-signal-red selection:text-white">
<!-- Top Bar -->
<header class="fixed top-0 w-full z-50 px-6 h-20 flex justify-between items-center">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-ash text-xl" data-icon="sensors">sensors</span>
<h1 class="font-subheading text-subheading text-ash uppercase tracking-widest text-[14px]">AgrypniaOxus</h1>
</div>
<div class="flex items-center gap-2">
<div class="w-1.5 h-1.5 rounded-full bg-signal-red"></div>
<span class="font-micro text-micro text-ash uppercase tracking-[0.2em]">Live Stream</span>
</div>
</header>
<!-- Main Workspace -->
<main class="flex-1 flex flex-col items-center justify-between pt-24 pb-32 px-6">
<!-- Top Stats -->
<div class="w-full flex justify-center gap-12">
<div class="flex flex-col items-center gap-2">
<div class="flex items-center gap-2">
<div class="w-1 h-1 rounded-full bg-signal-red"></div>
<span class="font-micro text-micro text-ash uppercase tracking-[0.2em]">Eyes Open</span>
</div>
</div>
<div class="flex flex-col items-center gap-2">
<div class="flex items-center gap-2">
<div class="w-1 h-1 rounded-full bg-signal-red"></div>
<span class="font-micro text-micro text-ash uppercase tracking-[0.2em]">Head Position OK</span>
</div>
</div>
</div>
<!-- Massive Display Headline -->
<div class="flex flex-col items-center">
<h2 class="text-huge font-display text-pure-white -tracking-[0.08em] leading-none">12%</h2>
<span class="font-micro text-micro text-ash uppercase tracking-[0.4em] -mt-2">Drowsiness Level</span>
</div>
<!-- Face Scanning Area (Minimal Hairlines) -->
<div class="relative w-64 h-64 md:w-80 md:h-80 flex items-center justify-center">
<!-- Fine Hairline Frame -->
<div class="absolute inset-0 border-[0.5px] border-pure-white/10 rounded-full"></div>
<div class="w-[96%] h-[96%] rounded-full overflow-hidden relative">
<img class="w-full h-full object-cover grayscale opacity-40 mix-blend-screen" data-alt="POV driver monitoring" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCwlWTY0sqjGdrYrVKJ1VIeDseMUPByngzRG06xPZnoIjWyKo7n_me0MCsBE238QFnnm5kOThzbM0KubrQxKVvcujgpS3jRBDX4JrDy4Y4PC-TRGlkf9iM1jQzXaTVV8RmD-AQoeiUM7EZ9iIeIAsj8OL-7Zld_GBOS29XX2jotTWR5JB9iKsk2yEy3nU9MryfOa9fD4NdTOWMU0UxoJXAmGDeT0UN1KrNOBMb93pM1SEwfIav4_dCJ765YSQh-mZ7v-IUVGAG6R39Q"/>
<!-- Subtle Scan -->
<div class="absolute left-0 right-0 h-[1px] bg-pure-white/20 animate-scan z-10"></div>
</div>
<!-- Corner Accents (Fine Hairlines) -->
<div class="absolute top-0 left-1/2 -translate-x-1/2 w-[1px] h-4 bg-pure-white/30"></div>
<div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-[1px] h-4 bg-pure-white/30"></div>
<div class="absolute left-0 top-1/2 -translate-y-1/2 h-[1px] w-4 bg-pure-white/30"></div>
<div class="absolute right-0 top-1/2 -translate-y-1/2 h-[1px] w-4 bg-pure-white/30"></div>
</div>
<!-- Primary Action (Signal Red Pill) -->
<div class="w-full max-w-xs">
<button class="w-full h-14 bg-signal-red text-pure-white font-caption text-caption uppercase tracking-[0.2em] rounded-full transition-all duration-300 active:scale-[0.97]" id="start-btn">
            Start Monitoring
        </button>
</div>
</main>
<!-- Navigation -->
<nav class="fixed bottom-0 w-full h-24 bg-void/80 backdrop-blur-md flex justify-around items-center px-10 border-t border-pure-white/5">
<a class="flex flex-col items-center gap-1 group" href="#">
<span class="material-symbols-outlined text-pure-white text-[20px]" data-icon="visibility">visibility</span>
<span class="font-micro text-micro text-pure-white uppercase tracking-widest">Detect</span>
</a>
<a class="flex flex-col items-center gap-1 opacity-40 hover:opacity-100 transition-opacity" href="#">
<span class="material-symbols-outlined text-ash text-[20px]" data-icon="query_stats">query_stats</span>
<span class="font-micro text-micro text-ash uppercase tracking-widest">Logs</span>
</a>
<a class="flex flex-col items-center gap-1 opacity-40 hover:opacity-100 transition-opacity" href="#">
<span class="material-symbols-outlined text-ash text-[20px]" data-icon="tune">tune</span>
<span class="font-micro text-micro text-ash uppercase tracking-widest">Setup</span>
</a>
</nav>
<script>
    const startBtn = document.getElementById('start-btn');
    let isMonitoring = false;

    startBtn.addEventListener('click', () => {
        isMonitoring = !isMonitoring;
        if (isMonitoring) {
            startBtn.textContent = 'Stop Monitoring';
            startBtn.classList.replace('bg-signal-red', 'bg-graphite');
        } else {
            startBtn.textContent = 'Start Monitoring';
            startBtn.classList.replace('bg-graphite', 'bg-signal-red');
        }
    });
</script>
</body></html>
