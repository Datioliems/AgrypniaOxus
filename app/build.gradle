plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "com.ai2026.drowsydriver"
    compileSdk 35

    defaultConfig {
        applicationId "com.ai2026.drowsydriver"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
    }

    // 2 phiên bản: 'realdata' (MRL + yawn — MẶC ĐỊNH) và 'original' (model public).
    // Cài SONG SONG được vì khác applicationId → KHÔNG ghi đè nhau.
    // realdata đặt ĐẦU TIÊN → Android Studio chọn nó làm Build Variant mặc định.
    flavorDimensions "dataset"
    productFlavors {
        realdata {                                 // ← MẶC ĐỊNH (first = default in AS)
            dimension "dataset"
            // applicationIdSuffix để trống → ID gốc, đây là bản chính thức
        }
        original {
            dimension "dataset"
            applicationIdSuffix ".original"       // bản phụ, cài song song
            versionNameSuffix "-orig"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        jvmTarget = "1.8"
    }
}

dependencies {
    implementation "androidx.activity:activity-ktx:1.9.2"
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.camera:camera-core:1.3.4"
    implementation "androidx.camera:camera-camera2:1.3.4"
    implementation "androidx.camera:camera-lifecycle:1.3.4"
    implementation "androidx.camera:camera-view:1.3.4"
    implementation "com.google.mediapipe:tasks-vision:0.10.14"
    implementation "org.tensorflow:tensorflow-lite:2.16.1"
    implementation "org.tensorflow:tensorflow-lite-support:0.4.4"
}
